# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "sv_calling_delly"
description: Call structural variants with Delly, create a TBI index, and annotate calls with AnnotSV.
keywords:
  - structural variants
  - delly
  - wgs
components:
  - delly/call
  - bcftools/index
  - annotsv/annotsv

input:
  - ch_bam:
      description: BAM/CRAM files with indexes
      structure:
        - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
        - bam:
            type: file
            description: Aligned BAM/CRAM file
            pattern: "*.{bam,cram}"
        - bai:
            type: file
            description: BAM/CRAM index file
            pattern: "*.{bai,crai}"
  - ch_fasta:
      description: Reference genome FASTA
      structure:
        - meta2:
            type: map
            description: Groovy Map containing reference information
        - fasta:
            type: file
            description: Genome reference FASTA file
            pattern: "*.{fa,fasta}"
  - ch_fai:
      description: Reference genome FASTA index
      structure:
        - meta3:
            type: map
            description: Groovy Map containing reference information
        - fai:
            type: file
            description: Genome reference FASTA index
            pattern: "*.{fa.fai,fasta.fai}"
  - ch_annotsv_annotations:
      description: AnnotSV annotations directory
      structure:
        - meta:
            type: map
            description: Groovy Map containing annotations information
        - annotations:
            type: directory
            description: Directory containing AnnotSV annotations
  - ch_candidate_genes:
      description: Optional candidate genes file
      structure:
        - meta:
            type: map
            description: Groovy Map containing candidate genes information
        - candidate_genes:
            type: file
            description: File containing candidate genes
            pattern: "*.txt"
  - ch_false_positive_snv:
      description: Optional false positive SNV file
      structure:
        - meta:
            type: map
            description: Groovy Map containing false positive SNV information
        - false_positive_snv:
            type: file
            description: VCF file containing false positive small variants
            pattern: "*.{vcf,vcf.gz}"
  - ch_gene_transcripts:
      description: Optional preferred gene transcripts file
      structure:
        - meta:
            type: map
            description: Groovy Map containing gene transcripts information
        - gene_transcripts:
            type: file
            description: File containing preferred gene transcripts
            pattern: "*.txt"

output:
  - vcf:
      description: Raw Delly SV calls
      structure:
        - meta:
            type: map
            description: Groovy Map containing sample information
        - "*.vcf.gz":
            type: file
            description: Gzipped VCF with structural variant calls from Delly
            pattern: "*.vcf.gz"
  - vcf_index:
      description: Raw Delly SV calls index
      structure:
        - meta:
            type: map
            description: Groovy Map containing sample information
        - "*.tbi":
            type: file
            description: Tabix index for raw Delly SV calls
            pattern: "*.tbi"
  - annotated_tsv:
      description: AnnotSV annotated Delly structural variants
      structure:
        - meta:
            type: map
            description: Groovy Map containing sample information
        - "*.tsv":
            type: file
            description: TSV file with annotated Delly structural variants
            pattern: "*.tsv"
  - annotated_vcf:
      description: Optional AnnotSV VCF output for Delly structural variants
      structure:
        - meta:
            type: map
            description: Groovy Map containing sample information
        - "*.vcf":
            type: file
            description: VCF file with annotated Delly structural variants
            pattern: "*.vcf"
  - unannotated_tsv:
      description: Unannotated Delly structural variants
      structure:
        - meta:
            type: map
            description: Groovy Map containing sample information
        - "*.unannotated.tsv":
            type: file
            description: TSV file with unannotated Delly structural variants
            pattern: "*.unannotated.tsv"
  - versions:
      description: Software versions
      structure:
        - "versions.yml":
            type: file
            description: File containing software versions
            pattern: "versions.yml"

authors:
  - "@li-cris"
maintainers:
  - "@li-cris"
